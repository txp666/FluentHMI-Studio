name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch replaces a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # One Qt for every job and for the local builds. aqtinstall comes from GitHub until a release reads
  # the Windows x64 repository layout of Qt 6.11 and later (miurahr/aqtinstall#1000).
  QT_VERSION: "6.12.0"
  AQT_SOURCE: "git+https://github.com/miurahr/aqtinstall.git"

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]

    steps:
      - name: Check out sources and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use the Ubuntu mirror
        if: runner.os == 'Linux'
        run: sudo sh scripts/use-ubuntu-mirror.sh

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          aqtsource: ${{ env.AQT_SOURCE }}
          modules: "qtserialport"
          cache: true

      # Install Qt has set up Python, whose gbk codec the line parser's GBK table is made from.
      - name: Check the GBK table
        run: python tools/gen_gbk_table.py --check

      - name: Install Ninja
        if: runner.os != 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure (Ninja)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFHMI_BUILD_TESTS=ON

      - name: Configure (MSVC)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DFHMI_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error

      - name: Show failing tests in full
        if: failure()
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build -C Release --rerun-failed -VV
