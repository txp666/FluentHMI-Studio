name: Release

# Push a tag vX.Y.Z matching project(VERSION) in CMakeLists.txt. Both platforms build,
# test and package; the release is published only when every package passed its check.
# A tag with a suffix (v0.2.0-rc.1) builds the same way but is published as a pre-release,
# which the in-app update check does not offer.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            configure: -G "Visual Studio 17 2022" -A x64
          - name: macOS universal
            os: macos-14
            configure: -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

    steps:
      - name: Check out sources and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          modules: "qtserialport"
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ninja
        if: runner.os == 'macOS'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure
        shell: bash
        run: cmake -S . -B build ${{ matrix.configure }} -DFHMI_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error

      - name: Check the tag matches the project version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < build/FluentHMIStudio-version.txt)"
          if [ "${GITHUB_REF_NAME%%-*}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match CMake version ${version}" >&2
            exit 1
          fi

      - name: Package
        run: python scripts/package.py --build-dir build --output-dir dist --config Release

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ runner.os }}
          path: dist/*.zip*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/release-notes/${GITHUB_REF_NAME%%-*}.md"
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" dist/* "${flags[@]}" --title "FluentHMI Studio ${GITHUB_REF_NAME}" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" dist/* "${flags[@]}" --title "FluentHMI Studio ${GITHUB_REF_NAME}" --generate-notes
          fi
